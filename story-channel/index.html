<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Video Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0f1115; --panel:#191c22; --fg:#e8eaed; --muted:#9aa0a6; --btn:#2b6cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px; min-height:100vh; }
  #out { height:min(76vh,880px); aspect-ratio:9/16; max-width:100%; border-radius:12px; background:#000; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; }
  button, label.btn { background:var(--btn); color:#fff; border:0; border-radius:8px; padding:9px 14px; font-size:14px; cursor:pointer; }
  button.rec { background:#e0344b; } button.alt, label.btn { background:#3a3f4b; }
  button:disabled { opacity:.5; cursor:default; }
  #scrub { width:min(460px,92vw); }
  #info { font-size:13px; color:var(--muted); max-width:min(460px,92vw); text-align:center; min-height:2.6em; }
  #status a { color:#8fb4ff; }
  input[type=file] { display:none; }
</style>
</head>
<body>
<canvas id="out" width="1080" height="1920"></canvas>
<input id="scrub" type="range" min="0" max="1000" value="0">
<div class="bar">
  <button id="play">▶ Play</button>
  <button id="rec" class="rec">● Export video</button>
  <label class="btn">🎙 Load voice<input id="voice" type="file" accept="audio/*"></label>
  <button id="syncBtn" class="alt" disabled>⟲ Auto-sync</button>
  <button id="charBtn" class="alt">Character sheet</button>
</div>
<div id="info"></div>
<div id="status" style="font-size:13px"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.min.js"></script>
<script>
// Load character.js (the creator's signature character) and the episode chosen with ?ep=
(function () {
  const q = new URLSearchParams(location.search), want = q.get('ep');
  const ep = want && /^[\w\-\/.]+\.js$/.test(want) && !want.includes('..') ? want : null;
  window.EP_PATH = ep || ''; window.EP_DIR = ep && ep.includes('/') ? ep.slice(0, ep.lastIndexOf('/') + 1) : '';
  // without ?ep= only the character loads (character sheet / preview)
  document.write('<script src="character.js"><\/script>' + (ep ? '<script src="' + ep + '"><\/script>' : ''));
})();
</script>
<script>
"use strict";
// =====================================================================
//  CORE
// =====================================================================
const W = 1080, H = 1920;
// colors are written as normal (sRGB) hex codes; convert them so the sRGB output shows them exactly as written
const _setStyle = THREE.Color.prototype.setStyle;
THREE.Color.prototype.setStyle = function (style) { _setStyle.call(this, style); return this.convertSRGBToLinear(); };
const HERO = window.CHARACTER, EP = window.EPISODE || { title: 'preview', endCard: false, scenes: [{ text: 'Hello!', actors: [{ id: 'hero', at: 'studio', rot: 180, anim: 'wave', face: 'happy' }] }] };
if (EP.handle == null && HERO.handle) EP.handle = HERO.handle;   // channel handle lives in character.js
if (EP.watermark == null && HERO.watermark === false) EP.watermark = false;
const out = document.getElementById('out'), ctx = out.getContext('2d');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const camera = new THREE.PerspectiveCamera(66, W / H, 0.1, 900);
const hemi = new THREE.HemisphereLight('#cfc8ff', '#7a6a88', 0.7); scene.add(hemi);
const sun = new THREE.DirectionalLight('#ffd2be', 0.5);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 220 });
sun.shadow.bias = -0.0005;
scene.add(sun); scene.add(sun.target);

let seed = 11;
const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const pick = a => a[Math.floor(rand() * a.length)];
const clamp01 = t => Math.max(0, Math.min(1, t));
const lerp = (a, b, t) => a + (b - a) * t;
const lerpV = (a, b, t) => a.map((v, i) => lerp(v, b[i], t));

const D2R = Math.PI / 180;

function canvasTex(w, h, draw, repeat) {

  draw(c.getContext('2d'), w, h);

  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const _mc = {};

}

  m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = true; parent.add(m); return m;

// ---------- shared textures
const glowTex = canvasTex(128, 128, g => {
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  gr.addColorStop(0, 'rgba(255,245,215,1)'); gr.addColorStop(0.18, 'rgba(255,215,150,0.7)');
  gr.addColorStop(0.5, 'rgba(255,190,120,0.18)'); gr.addColorStop(1, 'rgba(255,180,110,0)');
  g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
});

}, [70, 1]);

  for (let i = 0; i < 8; i++) { g.fillStyle = ['#b9763c', '#a96a35', '#c28245', '#9e6230'][i % 4]; g.fillRect(i * 32, 0, 32, 256);
    g.fillStyle = 'rgba(60,30,10,.5)'; g.fillRect(i * 32, 0, 2, 256); g.fillRect(i * 32, (i * 97) % 256, 32, 2); }
}, [2, 10]);
function labelTex(text, bg, fg, w = 512, h = 96, font = 'bold 44px Georgia, serif') {
  return canvasTex(w, h, g => { g.fillStyle = bg; g.fillRect(0, 0, w, h); g.fillStyle = fg; g.font = font;
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, w / 2, h / 2 + 2); });

  night:    { sky: ['#1b2150', '#363a76', '#5f5896', '#8a74a6'], fog: '#4a4878', near: 22, far: 130, hs: '#9aa0e0', hg: '#2c2444', hi: 0.6, sun: '#b4c0ff', si: 0.3, dir: [0.4, 0.6, 0.5], lamps: 'on', win: true },
  day:      { sky: ['#3f8fea', '#7dbdfb', '#c9e6ff'], fog: '#cfe4f7', near: 90, far: 280, hs: '#d9ecff', hg: '#86a476', hi: 0.68, sun: '#fff1d6', si: 1.05, dir: [0.55, 0.75, 0.45], lamps: 'off', win: false },
  interior: { sky: ['#1a120c', '#1a120c'], fog: '#20160f', near: 40, far: 400, hs: '#ffe3c0', hg: '#3a2a1c', hi: 0.45, sun: '#ffffff', si: 0, dir: [0, 1, 0], lamps: 'on', win: true },
  indoor:   { sky: ['#30343e', '#30343e'], fog: '#3a3e48', near: 80, far: 500, hs: '#f6f2ea', hg: '#8f877a', hi: 0.92, sun: '#fffaf0', si: 0.42, dir: [0.25, 1, 0.35], lamps: 'off', win: true },

  morning:  { sky: ['#7fb2e8', '#bcd8f0', '#f6e3c8'], fog: '#e6dccd', near: 40, far: 220, hs: '#fff6e6', hg: '#8a90a0', hi: 0.8, sun: '#fff0d0', si: 0.65, dir: [0.7, 0.5, 0.3], lamps: 'off', win: false },

  blizzard: { sky: ['#cfd4e6', '#e3e6f1', '#eef0f6'], fog: '#e2e5ef', near: 6, far: 70, hs: '#ffffff', hg: '#b8bfd4', hi: 0.85, sun: '#ffffff', si: 0.3, dir: [0.3, 0.8, 0.3], lamps: 'off', win: false },
};
const skyCache = {};
const winLit = new THREE.MeshLambertMaterial({ color: '#ffd9a0', emissive: '#ffb45e', emissiveIntensity: 0.95 });
const winDark = new THREE.MeshLambertMaterial({ color: '#2c3550' });
const windows = [];
let curEnv = null, sunDir = new THREE.Vector3(-0.6, 0.45, 0.5);
const SEASONS = {
  winter: { ground: '#dfe3f1', roof: '#eef2fa', leaves: null, banks: true, cap: '#eef0fa', field: '#eef1f8', pineTip: '#f4f6fb', weather: 'snow' },
  summer: { ground: '#6dbb4f', roof: '#b0563f', leaves: ['#3e9a42', '#4fb04a'], banks: false, cap: '#8e8fb8', field: '#86c95a', pineTip: '#2f4a42', weather: 'clear' },
  autumn: { ground: '#9c9a58', roof: '#6e4a3c', leaves: ['#e0842c', '#c9452e'], banks: false, cap: '#eef0fa', field: '#b3a35e', pineTip: '#2f4a42', weather: 'clear' },
  spring: { ground: '#7fcf6a', roof: '#5a6a9a', leaves: ['#f4a9c8', '#9fdc7a'], banks: false, cap: '#eef0fa', field: '#93d872', pineTip: '#2f4a42', weather: 'clear' },
};
const grainTex = (base, spots, n, rep) => canvasTex(256, 256, g => { g.fillStyle = base; g.fillRect(0, 0, 256, 256);
  let sd = 9; const r = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < n; i++) { g.fillStyle = spots[i % spots.length]; const s = 1 + r() * 3; g.fillRect(r() * 256, r() * 256, s, s * (0.6 + r())); } }, rep);
const groundMat = new THREE.MeshLambertMaterial({ color: '#dfe3f1', map: grainTex('#ffffff', ['#e6e6e6', '#f2f2f2', '#d9d9d9', '#ffffff'], 2600, [140, 140]) }), roofMat = new THREE.MeshLambertMaterial({ color: '#eef2fa' });
const capMat = new THREE.MeshLambertMaterial({ color: '#eef0fa' }), fieldMat = new THREE.MeshLambertMaterial({ color: '#eef1f8' }), pineTipMat = new THREE.MeshLambertMaterial({ color: '#f4f6fb' });
const leafMats = [new THREE.MeshLambertMaterial({ color: '#3e9a42', flatShading: true }), new THREE.MeshLambertMaterial({ color: '#4fb04a', flatShading: true })];
const leaves = [], snowBanks = [];
function applyEnv(timeName, season, weather, winOn = true) {
  const key = timeName + '|' + season + '|' + weather + '|' + winOn; if (curEnv === key) return; curEnv = key;
  let tn = timeName; if ((weather === 'rain' || weather === 'storm') && ['day', 'morning', 'sunset'].includes(tn)) tn = 'overcast';
  const t = TIMES[tn] || TIMES.dusk;
  scene.background = skyCache[tn] || (skyCache[tn] = canvasTex(4, 512, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h); t.sky.forEach((c, i) => gr.addColorStop(i / Math.max(1, t.sky.length - 1), c));
    g.fillStyle = gr; g.fillRect(0, 0, w, h); }));
  const fm = weather === 'fog' ? [0.15, 0.35] : (weather === 'rain' || weather === 'storm') ? [0.6, 0.7] : [1, 1];
  scene.fog.color.set(t.fog); scene.fog.near = t.near * fm[0]; scene.fog.far = t.far * fm[1];
  hemi.color.set(t.hs); hemi.groundColor.set(t.hg); hemi.intensity = t.hi * (weather === 'storm' ? 0.8 : 1);
  sun.color.set(t.sun); sun.intensity = t.si * ((weather === 'rain' || weather === 'storm' || weather === 'fog') ? 0.45 : 1); sunDir.set(...t.dir).normalize();
  windows.forEach(w => w.mesh.material = (t.win && w.lit && winOn) ? winLit : winDark);
  fogSprites.forEach(s => { s.material.color.set(t.fog); s.material.opacity = weather === 'fog' ? 0.42 : 0.22; });
  clouds.visible = ['day', 'morning', 'sunset', 'dusk'].includes(tn) && weather !== 'fog';
  const S = SEASONS[season] || SEASONS.winter;
  groundMat.color.set(S.ground); roofMat.color.set(S.roof); capMat.color.set(S.cap); fieldMat.color.set(S.field); pineTipMat.color.set(S.pineTip);
  leaves.forEach(l => l.visible = !!S.leaves); if (S.leaves) S.leaves.forEach((c, i) => leafMats[i].color.set(c));

// =====================================================================
//  WORLD — winter street (road along X), school at the west end
// =====================================================================
const ANCH = {};
const world = new THREE.Group(); scene.add(world);
const fogSprites = [];
{
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 900), groundMat);
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
  addBox(world, 300, 0.06, 10, new THREE.MeshLambertMaterial({ color: '#5d5a66', map: grainTex('#ffffff', ['#d4d4d4', '#e8e8e8', '#bdbdbd'], 3000, [60, 2]) }), 50, 0.03, 0, false);
  [-0.16, 0.16].forEach(z => addBox(world, 300, 0.02, 0.1, '#e3c24a', 50, 0.07, z, false));
  [-4.7, 4.7].forEach(z => addBox(world, 300, 0.02, 0.12, '#e9e9f0', 50, 0.07, z, false));
  [-7, 7].forEach(z => { const m = new THREE.Mesh(new THREE.BoxGeometry(300, 0.24, 4), new THREE.MeshLambertMaterial({ map: paverTex }));
    m.position.set(50, 0.12, z); m.receiveShadow = true; world.add(m);
    addBox(world, 300, 0.3, 0.3, '#9a96a6', 50, 0.15, z > 0 ? 5 : -5, false); });
  // snow banks
  for (let i = 0; i < 60; i++) {
    const s = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 6), M('#f1f3fa'));
    const side = i % 2 ? 1 : -1; s.position.set(-40 + i * 3 + rand() * 2, 0, side * (10.2 + rand() * 0.8));
    s.scale.set(2 + rand() * 1.5, 0.5 + rand() * 0.5, 1.2); s.receiveShadow = true; world.add(s); snowBanks.push(s);
  }
}
// ---- houses
function gableRoof(w, d, h, wallCol) {
  const s = new THREE.Shape(); s.moveTo(-d / 2, 0); s.lineTo(d / 2, 0); s.lineTo(0, h); s.lineTo(-d / 2, 0);
  const geo = new THREE.ExtrudeGeometry(s, { depth: w, bevelEnabled: false }); geo.translate(0, 0, -w / 2);
  const m = new THREE.Mesh(geo, [M(wallCol), roofMat]); m.rotation.y = Math.PI / 2; m.castShadow = true; m.receiveShadow = true; return m;
}
const HOUSE_COLS = EP.houseColors || ['#9fc3e8', '#f2d49b', '#f4b6a6', '#b7dcb0', '#cdbbe8', '#f6e3b5', '#a9d8d8', '#f0c7d8'];
function house(x, z, face) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = face > 0 ? 0 : Math.PI; world.add(g);
  const w = 9 + rand() * 3, h = 5.2 + rand() * 2.6, d = 8, col = pick(HOUSE_COLS), two = h > 6.4;
  addBox(g, w, h, d, col, 0, h / 2, 0);
  const roof = gableRoof(w + 0.9, d + 1.2, 2.8 + rand() * 1.4, col); roof.position.y = h; g.add(roof);
  if (rand() < 0.6) addBox(g, 0.9, 2.2, 0.9, '#5a3a3a', w * 0.25, h + 2, -1);
  const f = d / 2 + 0.05;
  addBox(g, 1.5, 2.7, 0.12, pick(['#6e2b2b', '#2b4a3a', '#2b2f4a']), -w * 0.22, 1.35, f);
  addBox(g, 2.6, 0.35, 1.2, '#8c8494', -w * 0.22, 0.18, f + 0.5);
  const porch = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: '#ffcf8a', transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  porch.position.set(-w * 0.22 + 1.1, 2.9, f + 0.2); porch.scale.set(1.6, 1.6, 1); g.add(porch);
  const winAt = (wx, wy) => { addBox(g, 1.7, 1.9, 0.08, '#e8e4dc', wx, wy, f, false);
    const m = addBox(g, 1.4, 1.6, 0.1, winDark, wx, wy, f + 0.02, false); windows.push({ mesh: m, lit: rand() < 0.75 }); };
  winAt(w * 0.18, 2.2); if (w > 10) winAt(w * 0.38, 2.2);
  if (two) { winAt(-w * 0.22, 5.2); winAt(w * 0.25, 5.2); }
}
for (let x = -36; x <= 150; x += 15) { house(x + rand() * 3, 19 + rand() * 2, -1); house(x + 7 + rand() * 3, -19 - rand() * 2, 1); }
// ---- bare trees
const barkMat = M('#3a2f33'), leafGeo = new THREE.IcosahedronGeometry(1.1, 0);
function bareTree(x, z, s) {

    m.position.y = len / 2; m.castShadow = depth < 2; parent.add(m);
    if (depth >= 3) { const lf = new THREE.Mesh(leafGeo, leafMats[leaves.length % 2]); lf.position.y = len; lf.scale.setScalar(0.9 + rand() * 0.6);

      const c = new THREE.Group(); c.position.y = len * (0.55 + 0.45 * rand());
      c.rotation.set((rand() - 0.5) * 1.3, rand() * Math.PI * 2, (rand() - 0.5) * 1.3);

for (let i = 0; i < 16; i++) bareTree(-30 + i * 11 + rand() * 4, (i % 2 ? 1 : -1) * (12.5 + rand() * 2), 0.9 + rand() * 0.4);
// ---- mountains
[[-260, -120, 70], [-250, 60, 90], [-230, 200, 60], [120, -300, 80], [260, -260, 70], [300, 120, 90], [80, 320, 75]].forEach(([x, z, h]) => {
  const m = new THREE.Mesh(new THREE.ConeGeometry(h * 1.3, h, 7), M('#8e8fb8')); m.position.set(x, h / 2 - 2, z); scene.add(m);
  const cap = new THREE.Mesh(new THREE.ConeGeometry(h * 0.42, h * 0.32, 7), capMat); cap.position.set(x, h - h * 0.16 - 2, z); scene.add(cap);

{

// ---- street lamps
const lamps = [];
function lamp(x, z, num) {
